name: Release

on:
  push:
    tags:
      - 'v*.*'  # e.g. v0.1, v0.2

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install deps
        run: pip install -r requirements-pin.txt

      - name: Train model for release (match tag)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # choose training behavior by tag: v0.1 -> baseline; v0.2 -> improved
          if [[ "${TAG}" == "v0.1" ]]; then
            python training/train.py --version v0.1 --seed 42
          else
            python training/train.py --version v0.2 --seed 42 --model rf --n-estimators 200 --k 8
          fi

      - name: Build Docker image
        run: |
          TAG=${{ github.ref_name }}
          IMAGE=ghcr.io/${{ github.repository }}:${TAG}
          docker build -t ${IMAGE} .
          echo "IMAGE=${IMAGE}" >> $GITHUB_OUTPUT
        id: build_image

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          docker push ${{ steps.build_image.outputs.IMAGE }}

      - name: Smoke test container
        run: |
          IMAGE=${{ steps.build_image.outputs.IMAGE }}
          docker run -d --name triage-smoke -p 8081:8080 $IMAGE
          sleep 2
          # health
          curl -fS -s http://localhost:8081/health
          # predict with sample payload
          curl -fS -s -X POST http://localhost:8081/predict \
            -H "Content-Type: application/json" \
            -d '{"age":0.02,"sex":-0.044,"bmi":0.06,"bp":-0.03,"s1":-0.02,"s2":0.03,"s3":-0.02,"s4":0.02,"s5":0.02,"s6":-0.001}'
          docker stop triage-smoke

      - name: Create GitHub Release with artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: artifacts/*,CHANGELOG.md
