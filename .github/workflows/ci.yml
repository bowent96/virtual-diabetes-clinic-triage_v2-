name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install deps
        run: pip install -r requirements-pin.txt
      - name: Run linter
        run: ruff check .
      - name: Run tests
        run: pytest -q

  quick-train:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install deps
        run: pip install -r requirements-pin.txt
      - name: Train quick model (v0.1)
        run: |
          python training/train.py --version v0.1 --seed 42 --test-size 0.4
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts-v0.1
          path: artifacts/
